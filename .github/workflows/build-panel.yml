name: build-panel

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*.*.*'
    paths:
      - "panel/**"
      - "hashem.sh"
      - "hashem-backhaul.sh"
      - ".github/workflows/build-panel.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BIN_NAME: "gre-panel"
      VER: "latest"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true

      - name: Build gre-panel (amd64 + arm64)
        run: |
          cd panel
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
            BIN="hashem-${VER}"
          elif [[ "${{ github.ref }}" == refs/heads/dev ]]; then
            VER="dev-r${{ github.run_number }}"
            BIN="gre-panel"
          else
            VER="panel-r${{ github.run_number }}"
            BIN="gre-panel"
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.panelVersion=$VER" -o ${BIN}-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.panelVersion=$VER" -o ${BIN}-linux-arm64 .
          if [ "$BIN" != "gre-panel" ]; then
            cp ${BIN}-linux-amd64 gre-panel-linux-amd64
            cp ${BIN}-linux-arm64 gre-panel-linux-arm64
          fi
          ./${BIN}-linux-amd64 --version
          ls -la ${BIN}-linux-* gre-panel-linux-* 2>/dev/null || true
          echo "BIN_NAME=$BIN" >> $GITHUB_ENV
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Sync hashem.sh + grepanel into release
        run: |
          mkdir -p panel/dist
          cp hashem.sh panel/dist/hashem.sh
          cp hashem-chaff.sh panel/dist/hashem-chaff.sh
          cp hashem-backhaul.sh panel/dist/hashem-backhaul.sh
          cp panel/grepanel panel/dist/grepanel
          ls -la panel/dist/

      - name: Generate checksums.txt (SHA256, consumed by the panel updater)
        run: |
          cd panel
          sha256sum "${BIN_NAME}-linux-amd64" "${BIN_NAME}-linux-arm64" gre-panel-linux-amd64 gre-panel-linux-arm64 \
            dist/hashem.sh dist/hashem-chaff.sh dist/hashem-backhaul.sh dist/grepanel \
            | sed 's#  dist/#  #' | sort -u -k2 > checksums.txt
          cat checksums.txt

      # legacy main builds. IMPORTANT: once v1.0.0 exists these must never become GitHub's
      # "Latest" (old panels follow /releases/latest), so make_latest is "false".
      # Delete this step when you want to stop publishing panel-r* builds from main.
      - name: Create release (Branch)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          make_latest: "false"
          prerelease: false
          tag_name: panel-r${{ github.run_number }}
          name: "Panel build r${{ github.run_number }}"
          body: "Auto-built gre-panel from ${{ github.sha }}"
          files: |
            panel/${{ env.BIN_NAME }}-linux-amd64
            panel/${{ env.BIN_NAME }}-linux-arm64
            panel/dist/hashem.sh
            panel/dist/hashem-chaff.sh
            panel/dist/hashem-backhaul.sh
            panel/dist/grepanel
            panel/checksums.txt

      # Dev channel: prerelease only, never "Latest", never touches a stable tag.
      - name: Create release (Dev)
        if: ${{ github.ref == 'refs/heads/dev' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-r${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Dev build r${{ github.run_number }}"
          body: "Experimental dev build from ${{ github.sha }}. Not for production."
          prerelease: true
          make_latest: "false"
          files: |
            panel/${{ env.BIN_NAME }}-linux-amd64
            panel/${{ env.BIN_NAME }}-linux-arm64
            panel/dist/hashem.sh
            panel/dist/hashem-chaff.sh
            panel/dist/hashem-backhaul.sh
            panel/dist/grepanel
            panel/checksums.txt

      - name: Create release (Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Hashem Panel ${{ env.VER }}"
          prerelease: false
          make_latest: "true"
          # By not specifying 'body', the action will use the annotated tag message as the release notes automatically.
          files: |
            panel/${{ env.BIN_NAME }}-linux-amd64
            panel/${{ env.BIN_NAME }}-linux-arm64
            panel/gre-panel-linux-amd64
            panel/gre-panel-linux-arm64
            panel/dist/hashem.sh
            panel/dist/hashem-chaff.sh
            panel/dist/hashem-backhaul.sh
            panel/dist/grepanel
            panel/checksums.txt
