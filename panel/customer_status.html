<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Tunnel status</title>
<style>
:root{
  --bg:#f2f2f2;--s1:#ffffff;--s2:#fafafa;--line:#e4e4e7;
  --tx:#18181b;--tx2:#27272a;--mu:#52525b;
  --ac:hsl(217 91% 45%);--ok:#047857;--wr:#a16207;--er:#b91c1c;
  --r:16px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter","Vazirmatn",Tahoma,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#09090b;--s1:#121214;--s2:#18181b;--line:#27272a;
    --tx:#f4f4f5;--tx2:#e4e4e7;--mu:#a1a1aa;
    --ac:hsl(217 91% 65%);--ok:#22c55e;--wr:#eab308;--er:#f87171;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09090b;--s1:#121214;--s2:#18181b;--line:#27272a;
  --tx:#f4f4f5;--tx2:#e4e4e7;--mu:#a1a1aa;
  --ac:hsl(217 91% 65%);--ok:#22c55e;--wr:#eab308;--er:#f87171;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--tx2);font:450 15px/1.5 var(--font);min-height:100vh}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--mu);text-transform:uppercase}
.tools{display:flex;gap:8px}
button svg{display:block}
button{display:inline-flex;align-items:center;justify-content:center;font:inherit;color:var(--tx2);background:var(--s1);border:1px solid var(--line);border-radius:10px;height:34px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:24px;line-height:1.25;font-weight:700;color:var(--tx);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.wide{grid-column:1/-1}
.label{font-size:12px;font-weight:600;color:var(--mu);letter-spacing:.02em}
.big{font-size:26px;font-weight:700;color:var(--tx);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--mu);margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--s2);border:1px solid var(--line);margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width .4s}
ul{list-style:none;margin-top:8px}
li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
li:first-child{border-top:0}
.dot{font-size:13px;font-weight:600;color:var(--c)}
footer{margin-top:20px;font-size:12px;color:var(--mu);text-align:center}
[dir="rtl"] body{font-family:"Vazirmatn",Tahoma,var(--font)}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header>
    <span class="brand" data-t="brand">Hashem</span>
    <div class="tools">
      <button type="button" id="lang" aria-label="Language">فارسی</button>
      <button type="button" id="theme" aria-label="Theme"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <h1 id="name"></h1>
  <span class="pill" id="state"></span>
  <div class="grid">
    <section class="card">
      <div class="label" data-t="days">Days left</div>
      <div class="big" id="days"></div>
      <div class="sub" id="until"></div>
    </section>
    <section class="card">
      <div class="label" data-t="speed">Speed cap</div>
      <div class="big" id="cap"></div>
      <div class="sub" id="now"></div>
    </section>
    <section class="card wide">
      <div class="label" data-t="volume">Volume used</div>
      <div class="big" id="used"></div>
      <div class="sub" id="of"></div>
      <div class="bar" id="barw"><i id="bar"></i></div>
    </section>
    <section class="card wide">
      <div class="label" data-t="servers">Your servers</div>
      <ul id="links"></ul>
    </section>
  </div>
  <footer id="at"></footer>
</main>
<script>
(function () {
  "use strict";
  var data = /*HS_DATA*/null;
  var T = {
    en: {brand: "Hashem", days: "Days left", speed: "Speed cap", volume: "Volume used", servers: "Your servers",
      active: "Active", expired: "Plan ended", quota: "Volume used up", manual: "Paused by the seller",
      noEnd: "No end date", until: "until ", unlimited: "Unlimited", of: "of ", noQuota: "no volume limit",
      now: "now ↓ ", up: "Connected", down: "Not connected", running: "Running", server: "Server ", updated: "Updated ", lang: "فارسی", day: "", mbit: " Mbit/s"},
    fa: {brand: "هاشم", days: "روزهای باقی‌مانده", speed: "سقف سرعت", volume: "حجم مصرف‌شده", servers: "سرورهای شما",
      active: "فعال", expired: "پلن تمام شده", quota: "حجم تمام شده", manual: "متوقف‌شده توسط فروشنده",
      noEnd: "بدون تاریخ پایان", until: "تا ", unlimited: "نامحدود", of: "از ", noQuota: "بدون محدودیت حجم",
      now: "اکنون ↓ ", up: "متصل", down: "قطع", running: "در حال اجرا", server: "سرور ", updated: "به‌روزرسانی ", lang: "English", day: "", mbit: " مگابیت"}
  };
  var lang = "en";
  try { lang = localStorage.getItem("hs-lang") || ""; } catch (e) { lang = ""; }
  if (!lang) lang = /^fa\b/i.test(navigator.language || "") ? "fa" : "en";
  var $ = function (id) { return document.getElementById(id); };
  var num = function (n, d) { return Number(n).toLocaleString(lang === "fa" ? "fa-IR" : "en-US", {maximumFractionDigits: d}); };
  function bytes(n) {
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return num(n, i < 2 ? 0 : 2) + " " + u[i];
  }
  function mbit(bps) { return num(bps * 8 / 1e6, 1) + T[lang].mbit; }
  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });
    $("lang").textContent = t.lang;
    if (!data) return;
    $("name").textContent = data.name;
    var st = $("state");
    st.textContent = data.cut ? (t[data.cut] || data.cut) : t.active;
    st.style.setProperty("--c", data.cut ? "var(--er)" : "var(--ok)");
    if (data.days_left === null || data.days_left === undefined) {
      $("days").textContent = "∞"; $("until").textContent = t.noEnd;
    } else {
      $("days").textContent = num(data.days_left, 0);
      $("until").textContent = t.until + new Date(data.expires_at * 1000).toLocaleDateString(lang === "fa" ? "fa-IR" : "en-GB");
    }
    $("cap").textContent = data.rate_mbit > 0 ? num(data.rate_mbit, 1) + t.mbit : t.unlimited;
    $("now").textContent = t.now + mbit(data.speed_tx) + "  ↑ " + mbit(data.speed_rx);
    $("used").textContent = bytes(data.used);
    var q = data.quota_gb * 1e9;
    $("of").textContent = q > 0 ? t.of + bytes(q) : t.noQuota;
    $("barw").hidden = !(q > 0);
    $("bar").style.width = q > 0 ? Math.min(100, data.used / q * 100).toFixed(1) + "%" : "0";
    $("bar").style.background = q > 0 && data.used >= q * 0.9 ? "var(--er)" : "var(--ac)";
    var ul = $("links");
    ul.textContent = "";
    (data.links || []).forEach(function (s, i) {
      var li = document.createElement("li"), a = document.createElement("span"), b = document.createElement("span");
      a.textContent = t.server + num(i + 1, 0);
      b.className = "dot";
      b.textContent = s === "up" ? t.up : s === "running" ? t.running : t.down;
      b.style.setProperty("--c", s === "down" ? "var(--mu)" : "var(--ok)");
      li.appendChild(a); li.appendChild(b); ul.appendChild(li);
    });
    $("at").textContent = t.updated + new Date(data.at * 1000).toLocaleTimeString(lang === "fa" ? "fa-IR" : "en-GB");
  }
  $("lang").addEventListener("click", function () {
    lang = lang === "fa" ? "en" : "fa";
    try { localStorage.setItem("hs-lang", lang); } catch (e) {}
    render();
  });
  var theme = "";
  try { theme = localStorage.getItem("hs-theme") || ""; } catch (e) {}
  if (theme) document.documentElement.setAttribute("data-theme", theme);
  $("theme").addEventListener("click", function () {
    var dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    theme = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("hs-theme", theme); } catch (e) {}
  });
  render();
  setInterval(function () {
    fetch(location.pathname.replace(/\/$/, "") + ".json", {cache: "no-store", credentials: "omit"})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) { data = d; render(); } })
      .catch(function () {});
  }, 30000);
})();
</script>
</body>
</html>
